name: Deploy Web React to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-web-react
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VPS AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${VPS_USER}@${VPS_HOST}" \
            "set -euo pipefail; \
             cd /opt/taskflow-ecosystem/taskflow-web-react; \
             git pull origin main; \
             docker compose up -d --build --no-deps taskflow-web-react; \
             docker image prune -f"

      - name: Verify deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${VPS_USER}@${VPS_HOST}" \
            "curl -sf http://localhost:$(docker inspect taskflow-web-react --format '{{(index .NetworkSettings.Ports \"80/tcp\" 0).HostPort}}')/health || \
             docker inspect --format='{{.State.Health.Status}}' taskflow-web-react"