services:
  taskflow-web-react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-web-react
    restart: unless-stopped
    env_file:
      - /opt/taskflow-ecosystem/.env.web
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.taskflow-web-react.rule=Host(`taskflow-react.xprad.com`)"
      - "traefik.http.routers.taskflow-web-react.entrypoints=websecure"
      - "traefik.http.routers.taskflow-web-react.tls.certresolver=lets-encrypt"
      - "traefik.http.services.taskflow-web-react.loadbalancer.server.port=80"
      - "traefik.http.routers.taskflow-web-react.middlewares=secHeaders@file"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - public

networks:
  public:
    external: true